services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: leadgenai
      POSTGRES_PASSWORD: leadgenai
      POSTGRES_DB: leadgenai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadgenai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
